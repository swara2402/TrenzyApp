name: trenzy
description: "Flutter Trenzy App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  go_router: ^17.3.0
  http: ^1.6.0
  crypto: ^3.0.3
  flutter_riverpod: ^2.5.1
  socket_io_client: ^3.1.2
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  firebase_crashlytics: ^5.2.3
  cached_network_image: ^3.4.1
  firebase_analytics: ^12.4.3
  google_sign_in: ^6.2.1
  connectivity_plus: ^6.0.5
  video_player: ^2.8.0
  animations: ^2.2.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  image_picker: ^1.1.2
  webview_flutter: ^4.10.0
  meta: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_prunekit: ^2.4.0
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/logo/web_logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  image_path: "assets/logo/app_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/logo/web_logo.png
    - assets/logo/app_logo.png
    - assets/videos/splash.mp4
    - assets/firebase_options.json
    - assets/editorial/