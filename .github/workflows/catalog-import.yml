name: Trenzy Catalog Import

on:
  workflow_dispatch:
    inputs:
      embed:
        description: "Generate FashionCLIP embeddings after catalog import"
        required: true
        default: true
        type: boolean
      batch_size:
        description: "Database/embedding batch size"
        required: true
        default: "16"
        type: string

permissions:
  contents: read

jobs:
  catalog-import:
    name: Local Mac catalog migration + import
    runs-on: [self-hosted, macOS, ARM64]
    env:
      DB_HOST: ${{ secrets.RENDER_DB_HOST || 'localhost' }}
      DB_PORT: ${{ secrets.RENDER_DB_PORT || '5432' }}
      POSTGRES_DB: ${{ secrets.RENDER_POSTGRES_DB || 'trenzy' }}
      POSTGRES_USER: ${{ secrets.RENDER_POSTGRES_USER || 'postgres' }}
      POSTGRES_PASSWORD: ${{ secrets.RENDER_POSTGRES_PASSWORD || 'trenzy-local-password' }}
      APP_ENV: production
      IMAGE_DIR: /Users/sam/trenzy-data/Trenzy/images
      CATALOG_FILE: /Users/sam/trenzy-data/Trenzy/catalog.csv
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify local catalog files
        run: |
          test -d "$IMAGE_DIR"
          test -f "$CATALOG_FILE"
          image_count=$(find "$IMAGE_DIR" -type f \( -iname 'TRZ-*.jpg' -o -iname 'TRZ-*.jpeg' -o -iname 'TRZ-*.png' -o -iname 'TRZ-*.webp' \) | wc -l | tr -d ' ')
          echo "Catalog image count: $image_count"
          test "$image_count" -eq 2000

      - name: Verify local Python environment
        run: |
          python3 --version
          which python3

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Verify FashionCLIP prerequisites
        if: ${{ inputs.embed }}
        working-directory: backend
        run: |
          python3 - <<'PY'
          import importlib.util
          required = ("torch", "open_clip", "PIL")
          missing = [name for name in required if importlib.util.find_spec(name) is None]
          if missing:
              raise SystemExit(f"Missing embedding dependencies after requirements install: {missing}")
          from app.ai.ml_config import EMBEDDING_DIM
          print(f"FashionCLIP dependencies available; expected dimension={EMBEDDING_DIM}.")
          PY

      - name: Verify Alembic has one head
        working-directory: backend
        run: |
          python3 -m alembic heads
          heads=$(python3 -m alembic heads | awk 'NF')
          test "$(printf '%s\n' "$heads" | wc -l | tr -d ' ')" -eq 1

      - name: Upgrade local database
        working-directory: backend
        run: python3 -m alembic upgrade head

      - name: Verify catalog schema
        run: |
          python3 - <<'PY'
          import os
          import psycopg
          required = {
              "source",
              "source_license",
              "license_attribution",
              "image_sha256",
              "currency",
              "image_embedding_status",
              "text_embedding_status",
          }
          with psycopg.connect(
              host=os.environ["DB_HOST"],
              port=int(os.environ["DB_PORT"]),
              dbname=os.environ["POSTGRES_DB"],
              user=os.environ["POSTGRES_USER"],
              password=os.environ["POSTGRES_PASSWORD"],
          ) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      "SELECT column_name FROM information_schema.columns "
                      "WHERE table_name = 'products'"
                  )
                  actual = {row[0] for row in cur.fetchall()}
          missing = required - actual
          if missing:
              raise SystemExit(f"Missing product columns: {sorted(missing)}")
          print("Catalog schema verified.")
          PY

      - name: Validate 2,000 catalog rows and images
        working-directory: backend
        run: |
          python3 -m app.scripts.import_image_catalog             --image-dir "$IMAGE_DIR"             --catalog-file "$CATALOG_FILE"             --dry-run

      - name: Import 2,000 catalog products
        working-directory: backend
        run: |
          args=(
            --image-dir "$IMAGE_DIR"
            --catalog-file "$CATALOG_FILE"
            --batch-size "${{ inputs.batch_size }}"
          )
          if [ "${{ inputs.embed }}" = "true" ]; then
            args+=(--embed)
          fi
          python3 -m app.scripts.import_image_catalog "${args[@]}"

      - name: Verify imported catalog
        run: |
          python3 - <<'PY'
          import os
          import psycopg

          with psycopg.connect(
              host=os.environ["DB_HOST"],
              port=int(os.environ["DB_PORT"]),
              dbname=os.environ["POSTGRES_DB"],
              user=os.environ["POSTGRES_USER"],
              password=os.environ["POSTGRES_PASSWORD"],
          ) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      "SELECT COUNT(*) FROM products "
                      "WHERE source = 'trenzy_generated_catalog'"
                  )
                  catalog_count = cur.fetchone()[0]
                  cur.execute(
                      "SELECT COUNT(*) FROM products "
                      "WHERE source = 'trenzy_generated_catalog' "
                      "AND image_url IS NOT NULL"
                  )
                  image_count = cur.fetchone()[0]
                  cur.execute(
                      "SELECT COUNT(*) FROM products "
                      "WHERE id LIKE 'TRZ-%'"
                  )
                  trz_count = cur.fetchone()[0]
                  cur.execute(
                      "SELECT COUNT(*) FROM ("
                      "SELECT id FROM products WHERE id LIKE 'TRZ-%' "
                      "GROUP BY id HAVING COUNT(*) > 1"
                      ") duplicates"
                  )
                  duplicate_ids = cur.fetchone()[0]

                  print(f"Catalog products: {catalog_count}")
                  print(f"Catalog products with image_url: {image_count}")
                  print(f"TRZ products: {trz_count}")
                  print(f"Duplicate TRZ IDs: {duplicate_ids}")

                  assert catalog_count == 2000, f"Expected 2000 catalog products, got {catalog_count}"
                  assert image_count == 2000, f"Expected 2000 catalog images, got {image_count}"
                  assert trz_count == 2000, f"Expected 2000 TRZ products, got {trz_count}"
                  assert duplicate_ids == 0, f"Found {duplicate_ids} duplicate TRZ IDs"

                  if "${{ inputs.embed }}" == "true":
                      cur.execute(
                          "SELECT COUNT(*) FROM products "
                          "WHERE source = 'trenzy_generated_catalog' "
                          "AND image_embedding_status = 'completed' "
                          "AND image_embedding_vector IS NOT NULL"
                      )
                      embedding_count = cur.fetchone()[0]
                      print(f"Image embeddings: {embedding_count}")
                      assert embedding_count == 2000, (
                          f"Expected 2000 completed image embeddings, got {embedding_count}"
                      )

          print("2,000-product catalog verification PASSED.")
          PY