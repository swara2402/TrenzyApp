name: Trenzy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter-chat:
    name: Flutter direct-chat verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Parse and format changed chat code
        run: |
          dart format --output=none             lib/models/direct_message.dart             lib/screens/direct_chat_screen.dart             lib/services/api/social_api.dart             lib/services/api_service_base.dart             lib/services/api_service.dart             lib/services/mock_api_service.dart             lib/router/app_router.dart             lib/screens/friends_screen.dart             lib/models/user_model.dart             lib/screens/age_verification_screen.dart             lib/services/api/user_api.dart             lib/providers/auth_provider.dart             lib/app.dart
      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

  backend-static:
    name: Backend compile + launch-scope checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install "fastapi>=0.112.0,<1.0.0"
      - name: Compile Python sources
        run: python -m compileall -q backend/app backend/tests
      - name: Verify Alembic migration chain
        run: |
          test -f backend/migrations/env.py
          test -f backend/migrations/versions/0001_baseline.py
          test -f backend/migrations/versions/0002_user_date_of_birth.py
          python -m py_compile backend/migrations/env.py backend/migrations/versions/0001_baseline.py backend/migrations/versions/0002_user_date_of_birth.py
      - name: Verify production config has no concrete credentials
        run: |
          ! grep -Eq '^FIREBASE_API_KEY=AIza' backend/.env.production.example
      - name: Verify beta commerce gate is fail-closed
        run: |
          python - <<'PY'
          import os
          import sys
          os.environ.pop("TRENZY_BETA_COMMERCE_ENABLED", None)
          sys.path.insert(0, "backend")
          from app.launch_flags import BETA_COMMERCE_ENABLED
          assert BETA_COMMERCE_ENABLED is False
          print("Beta commerce gate defaults to disabled.")
          PY


  beta-repo-gates:
    name: Beta repository gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require native Flutter platforms for beta releases
        run: |
          test -d android
          test -d ios

      - name: Verify single Alembic head
        working-directory: backend
        run: |
          python -m pip install alembic sqlalchemy psycopg[binary]
          python - <<'PY'
          import os, subprocess, sys
          # The command must be able to parse the migration graph. A real
          # database upgrade is still performed in the deployment environment.
          result = subprocess.run(
              [sys.executable, "-m", "alembic", "heads"],
              capture_output=True, text=True
          )
          print(result.stdout)
          print(result.stderr)
          if result.returncode != 0:
              raise SystemExit(result.returncode)
          heads = [line for line in result.stdout.splitlines() if line.strip()]
          if len(heads) != 1:
              raise SystemExit(f"Expected exactly one Alembic head, found {len(heads)}")
          PY

      - name: Verify beta commerce UI is not exposed
        run: |
          ! grep -RniE "Shop on Partner|trackAffiliateClick|_shopOnPartner|Save to List" lib/screens/product_details_screen.dart
