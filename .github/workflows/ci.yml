name: Trenzy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter-beta:
    name: Flutter beta quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Flutter app
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build Android debug artifact
        run: flutter build apk --debug

  flutter-chat:
    name: Flutter direct-chat verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Parse and format changed chat code
        run: |
          dart format --output=none             lib/models/direct_message.dart             lib/screens/direct_chat_screen.dart             lib/services/api/social_api.dart             lib/services/api_service_base.dart             lib/services/api_service.dart             lib/services/mock_api_service.dart             lib/router/app_router.dart             lib/screens/friends_screen.dart             lib/models/user_model.dart             lib/screens/age_verification_screen.dart             lib/services/api/user_api.dart             lib/providers/auth_provider.dart             lib/app.dart
      - name: Test direct-message model
        run: flutter test test/direct_message_test.dart

  backend-static:
    name: Backend compile + launch-scope checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install "fastapi>=0.112.0,<1.0.0"
      - name: Compile Python sources
        run: python -m compileall -q backend/app backend/tests
      - name: Verify Alembic migration chain
        run: |
          test -f backend/migrations/env.py
          test -f backend/migrations/versions/0001_baseline.py
          test -f backend/migrations/versions/0002_user_date_of_birth.py
          python -m py_compile backend/migrations/env.py backend/migrations/versions/0001_baseline.py backend/migrations/versions/0002_user_date_of_birth.py
      - name: Verify production config has no concrete credentials
        run: |
          ! grep -Eq '^FIREBASE_API_KEY=AIza' backend/.env.production.example
      - name: Verify beta commerce gate is fail-closed
        run: |
          python - <<'PY'
          import os
          import sys
          os.environ.pop("TRENZY_BETA_COMMERCE_ENABLED", None)
          sys.path.insert(0, "backend")
          from app.launch_flags import BETA_COMMERCE_ENABLED
          assert BETA_COMMERCE_ENABLED is False
          print("Beta commerce gate defaults to disabled.")
          PY


  beta-repo-gates:
    name: Beta repository gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require native Flutter platforms for beta releases
        run: |
          test -d android
          test -d ios

      - name: Verify single Alembic head
        working-directory: backend
        env:
          POSTGRES_PASSWORD: ci-test-password
          APP_ENV: test
        run: |
          # Inspect migration metadata with the stdlib AST parser. Importing
          # migration modules pulls in the full application runtime and ML stack.
          python - <<'PY'
          import ast
          from pathlib import Path

          revisions = {}
          migration_dir = Path("migrations/versions")
          for path in sorted(migration_dir.glob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              metadata = {}
              for node in tree.body:
                  if isinstance(node, (ast.Assign, ast.AnnAssign)):
                      targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                      value_node = node.value
                      for target in targets:
                          if isinstance(target, ast.Name) and target.id in {"revision", "down_revision"}:
                              try:
                                  metadata[target.id] = ast.literal_eval(value_node)
                              except (ValueError, TypeError):
                                  pass
              revision = metadata.get("revision")
              if isinstance(revision, str):
                  revisions[revision] = metadata.get("down_revision")

          if not revisions:
              raise SystemExit("No Alembic revision metadata found")

          parents = set()
          missing = []
          for revision, down_revision in revisions.items():
              dependencies = down_revision if isinstance(down_revision, (tuple, list)) else (down_revision,)
              for parent in dependencies:
                  if parent is not None:
                      parents.add(parent)
                      if parent not in revisions:
                          missing.append((revision, parent))

          heads = sorted(set(revisions) - parents)
          print("Alembic revisions:", len(revisions))
          print("Alembic heads:", heads)
          if missing:
              raise SystemExit(f"Missing down_revision targets: {missing}")
          if len(heads) != 1:
              raise SystemExit(f"Expected exactly one Alembic head, found {len(heads)}: {heads}")
          PY
      - name: Verify beta commerce UI is not exposed
        run: |
          ! grep -RniE "Shop on Partner|trackAffiliateClick|_shopOnPartner|Save to List" lib/screens/product_details_screen.dart
  backend-auth-regression:
    name: Backend auth/age-gate regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Test DB-user age gate
        env:
          POSTGRES_PASSWORD: ci-test-password
        run: python -m pytest backend/tests/test_age_gate.py -q

  backend-full-suite:
    name: Backend full regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run complete backend regression suite
        working-directory: backend
        env:
          POSTGRES_PASSWORD: ci-test-password
        run: python -m pytest tests -q
