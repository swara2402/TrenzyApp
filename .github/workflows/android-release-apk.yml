name: Build Trenzy Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trenzy-release-apk
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "::error::Missing ANDROID_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing ANDROID_KEY_ALIAS repository secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Missing ANDROID_KEY_PASSWORD repository secret" && exit 1)

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          android = Path("android")
          android.mkdir(exist_ok=True)
          (android / "upload-keystore.jks").write_bytes(
              base64.b64decode(os.environ["KEYSTORE_BASE64"], validate=True)
          )

          def escape(value):
              return (value.replace("\\\\", "\\\\\\\\")
                           .replace("\\", "\\\\")
                           .replace(":", "\\:")
                           .replace("=", "\\=")
                           .replace("#", "\\#")
                           .replace("!", "\\!")
                           .replace(" ", "\\ "))

          properties = (
              "storeFile=upload-keystore.jks\\n"
              f"storePassword={escape(os.environ['KEYSTORE_PASSWORD'])}\\n"
              f"keyAlias={escape(os.environ['KEY_ALIAS'])}\\n"
              f"keyPassword={escape(os.environ['KEY_PASSWORD'])}\\n"
          )
          (android / "key.properties").write_text(properties, encoding="utf-8")
          PY
          test -s android/upload-keystore.jks

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build signed release APK
        run: flutter build apk --release --dart-define=TRENZY_API_BASE_URL=https://trenzy-staging-api.onrender.com

      - name: Verify APK signature
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Trenzy-Signed-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: |
          rm -f android/upload-keystore.jks android/key.properties
