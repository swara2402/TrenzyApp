name: Import Trenzy catalog

on:
  workflow_dispatch:
    inputs:
      image_dir:
        description: "Absolute path to the Trenzy image directory on the self-hosted Mac runner"
        required: true
        default: "/Users/sam/trenzy-data/Trenzy/images"
      catalog_file:
        description: "Absolute path to catalog.csv on the self-hosted Mac runner"
        required: true
        default: "/Users/sam/trenzy-data/Trenzy/catalog.csv"
      embed:
        description: "Generate FashionCLIP embeddings"
        required: true
        type: boolean
        default: true
      batch_size:
        description: "Database/checkpoint batch size"
        required: true
        default: "16"

permissions:
  contents: read

jobs:
  import:
    runs-on: self-hosted

    env:
      DB_HOST: ${{ secrets.TRENZY_DB_HOST }}
      DB_PORT: ${{ secrets.TRENZY_DB_PORT }}
      POSTGRES_DB: ${{ secrets.TRENZY_POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.TRENZY_POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.TRENZY_POSTGRES_PASSWORD }}
      APP_ENV: development
      PYTHON_BIN: /opt/homebrew/bin/python3.11

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Python 3.11
        run: |
          set -euo pipefail
          test -x "${PYTHON_BIN}" || { echo "::error::Python 3.11 not found at ${PYTHON_BIN}"; exit 1; }
          "${PYTHON_BIN}" --version

      - name: Verify dataset and database configuration
        env:
          IMAGE_DIR: ${{ inputs.image_dir }}
          CATALOG_FILE: ${{ inputs.catalog_file }}
        run: |
          set -euo pipefail
          test -n "${POSTGRES_PASSWORD}" || { echo "::error::TRENZY_POSTGRES_PASSWORD is not configured."; exit 1; }
          test -d "${IMAGE_DIR}" || { echo "::error::Image directory does not exist: ${IMAGE_DIR}"; exit 1; }
          test -f "${CATALOG_FILE}" || { echo "::error::Catalog file does not exist: ${CATALOG_FILE}"; exit 1; }
          echo "Dataset and database configuration found."

      - name: Install backend dependencies
        working-directory: backend
        run: |
          "${PYTHON_BIN}" -m pip install --upgrade pip
          "${PYTHON_BIN}" -m pip install -r requirements.txt

      - name: Validate catalog (no database writes)
        working-directory: backend
        env:
          IMAGE_DIR: ${{ inputs.image_dir }}
          CATALOG_FILE: ${{ inputs.catalog_file }}
        run: |
          "${PYTHON_BIN}" -m app.scripts.import_image_catalog \
            --image-dir "${IMAGE_DIR}" \
            --catalog-file "${CATALOG_FILE}" \
            --dry-run

      - name: Import catalog and generate embeddings
        if: ${{ inputs.embed }}
        working-directory: backend
        env:
          IMAGE_DIR: ${{ inputs.image_dir }}
          CATALOG_FILE: ${{ inputs.catalog_file }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          "${PYTHON_BIN}" -m app.scripts.import_image_catalog \
            --image-dir "${IMAGE_DIR}" \
            --catalog-file "${CATALOG_FILE}" \
            --embed \
            --batch-size "${BATCH_SIZE}"

      - name: Import catalog without embeddings
        if: ${{ !inputs.embed }}
        working-directory: backend
        env:
          IMAGE_DIR: ${{ inputs.image_dir }}
          CATALOG_FILE: ${{ inputs.catalog_file }}
        run: |
          "${PYTHON_BIN}" -m app.scripts.import_image_catalog \
            --image-dir "${IMAGE_DIR}" \
            --catalog-file "${CATALOG_FILE}"
